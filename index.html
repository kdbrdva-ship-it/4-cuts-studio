
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4 CUTS STUDIO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif;text-align:center;padding:25px 15px}
h1{letter-spacing:5px;font-size:27px;margin:15px 0 8px}
.sub{color:#aaa;font-size:12px;letter-spacing:3px;margin-bottom:30px}
h2{font-size:17px;font-weight:500;margin:25px 0 15px}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:430px;margin:auto}
.theme{background:#181818;color:white;border:1px solid #333;border-radius:12px;padding:15px 8px;cursor:pointer}
.theme.active{border:2px solid white;background:#292929}
.theme b{display:block;font-size:14px;margin-bottom:6px}
.theme small{color:#aaa;font-size:11px}
button{border:0;border-radius:30px;padding:14px 24px;background:white;color:#111;font-weight:bold;font-size:13px;letter-spacing:1px;cursor:pointer;margin:8px}
button:disabled{opacity:.4}
.camera{max-width:420px;margin:20px auto}
video{width:100%;border-radius:12px;background:#222;transform:scaleX(-1)}
#status{color:#bbb;font-size:13px;min-height:22px;margin:12px}
#count{font-size:45px;font-weight:bold;margin:10px}
#result{margin:25px auto;max-width:360px}
canvas{width:100%;height:auto;border-radius:4px}
.hidden{display:none}
.note{font-size:11px;color:#777;line-height:1.6;margin:25px auto;max-width:330px}
</style>
</head>
<body>

<h1>4 CUTS STUDIO</h1>
<div class="sub">YOUR MOMENT · YOUR FOUR CUTS</div>

<h2>CHOOSE YOUR MOOD</h2>
<div class="themes">
<button class="theme active" data-theme="bw" onclick="chooseTheme(this)">
<b>CLASSIC B&W</b><small>Timeless black & white</small>
</button>
<button class="theme" data-theme="pink" onclick="chooseTheme(this)">
<b>COQUETTE ♡</b><small>Pink bows & romance</small>
</button>
<button class="theme" data-theme="vintage" onclick="chooseTheme(this)">
<b>VINTAGE</b><small>Retro film mood</small>
</button>
<button class="theme" data-theme="color" onclick="chooseTheme(this)">
<b>COLORFUL ✦</b><small>Fun & bright</small>
</button>
</div>

<div class="camera">
<h2>YOUR CAMERA</h2>
<video id="video" autoplay playsinline muted></video>
<div id="status">Выбери стиль и включи камеру</div>
<div id="count"></div>
<button onclick="startCamera()">OPEN CAMERA</button>
<button id="shoot" onclick="startSession()" disabled>START PHOTO SESSION</button>
</div>

<div id="result" class="hidden">
<h2>YOUR PHOTO STRIP</h2>
<canvas id="output"></canvas>
<br>
<button onclick="downloadPhoto()">DOWNLOAD JPG</button>
<button onclick="again()">TAKE AGAIN</button>
</div>

<div class="note">4 CUTS STUDIO · CAPTURE YOUR MOMENT<br>Made with love ♡</div>

<script>
const video=document.getElementById('video');
const statusText=document.getElementById('status');
const count=document.getElementById('count');
const shoot=document.getElementById('shoot');
const output=document.getElementById('output');
const out=output.getContext('2d');

let stream=null;
let photos=[];
let selected='bw';

function chooseTheme(btn){
 document.querySelectorAll('.theme').forEach(x=>x.classList.remove('active'));
 btn.classList.add('active');
 selected=btn.dataset.theme;
 statusText.textContent='Стиль выбран! Теперь включи камеру.';
}

async function startCamera(){
 try{
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},
   audio:false
  });
  video.srcObject=stream;
  shoot.disabled=false;
  statusText.textContent='Камера готова! Нажми START PHOTO SESSION.';
 }catch(e){
  statusText.textContent='Не удалось открыть камеру. Разреши доступ к камере в браузере.';
 }
}

function wait(ms){return new Promise(r=>setTimeout(r,ms));}

async function startSession(){
 if(!stream)return;
 shoot.disabled=true;
 photos=[];
 document.getElementById('result').classList.add('hidden');

 for(let i=0;i<4;i++){
  statusText.textContent='PHOTO '+(i+1)+' OF 4';
  for(let n=3;n>0;n--){
   count.textContent=n;
   await wait(1000);
  }
  count.textContent='✦';
  await wait(300);
  photos.push(capture());
  count.textContent='';
  await wait(500);
 }
 renderStrip();
 document.getElementById('result').classList.remove('hidden');
 statusText.textContent='Готово! Твоя фотополоска готова ♡';
 shoot.disabled=false;
}

function capture(){
 const c=document.createElement('canvas');
 c.width=600;
 c.height=750;
 const x=c.getContext('2d');

 x.save();
 if(selected==='bw') x.filter='grayscale(1) contrast(1.12)';
 if(selected==='pink') x.filter='sepia(.15) saturate(1.25) hue-rotate(315deg) brightness(1.06)';
 if(selected==='vintage') x.filter='sepia(.35) saturate(.8) contrast(.9) brightness(1.05)';
 if(selected==='color') x.filter='saturate(1.5) contrast(1.05)';
 x.translate(600,0);
 x.scale(-1,1);
 x.drawImage(video,0,0,600,750);
 x.restore();

 decoratePhoto(x);
 return c;
}

function decoratePhoto(x){
 if(selected==='pink'){
  x.fillStyle='rgba(255,190,215,.12)';
  x.fillRect(0,0,600,750);
  x.font='65px Arial';
  x.fillStyle='white';
  x.fillText('♡',20,75);
  x.fillText('♡',510,720);
  x.font='48px Arial';
  x.fillText('🎀',270,65);
 }
 if(selected==='vintage'){
  x.fillStyle='rgba(180,120,55,.12)';
  x.fillRect(0,0,600,750);
  x.strokeStyle='rgba(255,235,190,.65)';
  x.lineWidth=12;
  x.strokeRect(12,12,576,726);
 }
 if(selected==='color'){
  x.font='48px Arial';
  x.fillStyle='white';
  x.fillText('✦',25,65);
  x.fillText('✧',520,710);
 }
 if(selected==='bw'){
  x.strokeStyle='white';
  x.lineWidth=8;
  x.strokeRect(8,8,584,734);
 }
}

function renderStrip(){
 const w=660;
 const h=4*810+180;
 output.width=w;
 output.height=h;

 let bg='#f4f1ed';
 let ink='#222';

 if(selected==='bw'){bg='#111';ink='#fff'}
 if(selected==='pink'){bg='#ffe5ef';ink='#9d526e'}
 if(selected==='vintage'){bg='#e6d3ae';ink='#755536'}
 if(selected==='color'){bg='#fff0a8';ink='#6734a0'}

 out.fillStyle=bg;
 out.fillRect(0,0,w,h);

 out.textAlign='center';
 out.fillStyle=ink;
 out.font='bold 32px Arial';
 out.fillText('4 CUTS STUDIO',w/2,65);

 out.font='18px Arial';
 const subtitle={
  bw:'CLASSIC BLACK & WHITE',
  pink:'A LITTLE BIT OF LOVE ♡',
  vintage:'MEMORIES ON FILM',
  color:'GOOD TIMES ONLY ✦'
 };
 out.fillText(subtitle[selected],w/2,105);

 photos.forEach((photo,i)=>{
  const y=135+i*810;
  out.drawImage(photo,35,y,590,738);

  out.strokeStyle=ink;
  out.lineWidth=selected==='pink'?5:3;
  out.strokeRect(35,y,590,738);

  if(selected==='pink'){
   out.fillStyle='#bd7390';
   out.font='32px Arial';
   out.textAlign='right';
   out.fillText('♡',610,y+38);
  }
  if(selected==='vintage'){
   out.fillStyle='#755536';
   out.font='15px Arial';
   out.textAlign='left';
   out.fillText('FILM 04  ·  NO.'+(i+1),45,y+725);
  }
 });

 out.textAlign='center';
 out.fillStyle=ink;
 out.font='20px Arial';
 out.fillText('THANK YOU FOR THE MEMORIES',w/2,h-55);
}

function downloadPhoto(){
 const link=document.createElement('a');
 link.download='4-cuts-studio.jpg';
 link.href=output.toDataURL('image/jpeg',.95);
 link.click();
}

function again(){
 photos=[];
 document.getElementById('result').classList.add('hidden');
 statusText.textContent='Готова к новой съёмке!';
 count.textContent='';
}
</script>
</body>
</html>
